services:
  app:
    build: .
    restart: unless-stopped
    ports:
      - "127.0.0.1:3000:3000"
    environment:
      NODE_ENV: production
      PORT: "3000"
      DB_PATH: /app/data/atlas.sqlite
      COOKIE_SECURE: "true"
      ADMIN_EMAIL: ${ADMIN_EMAIL:?Set ADMIN_EMAIL in the deployment environment}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:?Set a strong ADMIN_PASSWORD in the deployment environment}
    volumes:
      - atlas-data:/app/data
    security_opt:
      - no-new-privileges:true
volumes:
  atlas-data:
